<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Inspector - Добавить релиз</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="submit-release-page">
  <div class="nav-bar">
    <a href="index.html">
      <div class="svg-logo"><svg fill="#D9D9D9" width="45px" height="45px" viewBox="0 0 256 256" id="Flat" xmlns="http://www.w3.org/2000/svg">
        <path d="M188.29883,43.31128a8.00224,8.00224,0,0,0-1.35889-.94751,103.67838,103.67838,0,1,0,1.35889.94751ZM128,152a24,24,0,1,1,24-24A24.0275,24.0275,0,0,1,128,152Zm88-24c0,2.47168-.10791,4.91833-.30859,7.339l-47.71875-8.41419a39.84182,39.84182,0,0,0-10.95777-26.41552l27.77808-39.671A87.83762,87.83762,0,0,1,216,128Z"/>
      </svg></div>
      <div class="name-logo">Music Inspector</div>
    </a>
    <a href="about-us.html">
      <div class="about-us-but"><svg fill="#969696" width="px" height="25px" viewBox="-3 0 19 19" xmlns="http://www.w3.org/2000/svg" class="cf-icon-svg"><path d="M12.517 12.834v1.9a1.27 1.27 0 0 1-1.267 1.267h-9.5a1.27 1.27 0 0 1-1.267-1.267v-1.9A3.176 3.176 0 0 1 3.65 9.667h5.7a3.176 3.176 0 0 1 3.167 3.167zM3.264 5.48A3.236 3.236 0 1 1 6.5 8.717a3.236 3.236 0 0 1-3.236-3.236z"/></svg></div>
    </a>
    <div class="search-bar">
      <div class="search-icon">
        <svg stroke="currentColor" fill="#969696" stroke-width="0" viewBox="0 0 512 512" class="size-4" height="25px" width="25px" xmlns="http://www.w3.org/2000/svg"><path d="M337.509 305.372h-17.501l-6.571-5.486c20.791-25.232 33.922-57.054 33.922-93.257C347.358 127.632 283.896 64 205.135 64 127.452 64 64 127.632 64 206.629s63.452 142.628 142.225 142.628c35.011 0 67.831-13.167 92.991-34.008l6.561 5.487v17.551L415.18 448 448 415.086 337.509 305.372zm-131.284 0c-54.702 0-98.463-43.887-98.463-98.743 0-54.858 43.761-98.742 98.463-98.742 54.7 0 98.462 43.884 98.462 98.742 0 54.856-43.762 98.743-98.462 98.743z"></path></svg>
      </div>
      <input type="text" class="search-input" placeholder="Поиск...">
    </div>
    <!-- Auth buttons (shown when not logged in) -->
    <a href="login.html" class="sing-in-but auth-buttons">Войти</a>
    <a href="register.html" class="sing-up-but auth-buttons">Регистрация</a>
    
    <!-- Profile button (shown when logged in) -->
    <div class="profile-section" style="display: none;">
      <span class="profile-nickname" id="profile-nickname"></span>
      <a href="profile.html" class="profile-avatar-link">
        <div class="profile-avatar" id="profile-avatar"></div>
      </a>
    </div>
  </div>

  <div class="container">
    <div class="main-content submit-release-content">
      <h1>Добавить релиз</h1>

      <div class="submit-release-layout">
        <form id="release-form" class="release-form release-form-card">
          <div class="form-group">
            <label for="title">Название релиза</label>
            <input type="text" id="title" name="title" required maxlength="255" placeholder="Название трека или альбома">
            <span class="error-message" id="title-error"></span>
          </div>

          <div class="form-group">
            <label for="artist">Исполнитель</label>
            <div class="artist-input-wrapper">
              <input type="text" id="artist" name="artist" required maxlength="255" placeholder="Имя исполнителя" autocomplete="off">
              <div id="artist-suggestions" class="artist-suggestions"></div>
            </div>
            <button type="button" id="create-artist-btn" class="create-artist-btn" style="display: none;">Создать нового исполнителя</button>
            <span class="error-message" id="artist-error"></span>
          </div>

          <div class="form-row two-columns">
            <div class="form-group">
              <label for="type">Тип релиза</label>
              <select id="type" name="type" required>
                <option value="">Выберите тип</option>
                <option value="single">Сингл</option>
                <option value="album">Альбом</option>
                <option value="ep">EP</option>
              </select>
              <span class="error-message" id="type-error"></span>
            </div>

            <div class="form-group">
              <label for="release-date">Дата релиза</label>
              <input type="date" id="release-date" name="release-date">
              <span class="error-message" id="release-date-error"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="cover">Обложка</label>
            <input type="file" id="cover" name="cover" accept="image/jpeg,image/jpg,image/png,image/webp" required>
            <div id="cover-preview" class="cover-preview"></div>
            <span class="error-message" id="cover-error"></span>
          </div>

          <div class="form-group">
            <label for="link">Ссылка на прослушивание</label>
            <input type="url" id="link" name="link" placeholder="https://...">
            <span class="error-message" id="link-error"></span>
          </div>

          <div class="form-group" id="artist-image-group" style="display: none;">
            <label for="artist-image">Изображение исполнителя</label>
            <input type="file" id="artist-image" name="artist-image" accept="image/jpeg,image/jpg,image/png,image/webp">
            <div id="artist-image-preview" class="cover-preview"></div>
            <span class="error-message" id="artist-image-error"></span>
            <small>Обязательно при создании нового исполнителя</small>
          </div>

          <div class="form-section">
            <h2>Рецензия</h2>
            <p class="form-hint">Для добавления релиза оставьте рецензию и выставьте оценки</p>

            <div class="form-group">
              <label for="review-text">Текст рецензии</label>
              <textarea id="review-text" name="review-text" rows="6" required placeholder="Опишите ваше впечатление от релиза..."></textarea>
              <span class="error-message" id="review-text-error"></span>
            </div>

            <div class="ratings-section ratings-mixer">
              <h3>Оценки по критериям (0-10)</h3>

              <div class="mixer-grid">
                <div class="rating-group mixer-channel">
                  <label for="score1">Рифмы / образы</label>
                  <div class="slider-container mixer-slider-container">
                    <input type="range" id="score1" name="score1" min="0" max="10" value="5" step="0.5" class="rating-slider mixer-slider">
                    <span class="slider-value" id="score1-value">5</span>
                  </div>
                  <span class="error-message" id="score1-error"></span>
                </div>

                <div class="rating-group mixer-channel">
                  <label for="score2">Структура / ритм</label>
                  <div class="slider-container mixer-slider-container">
                    <input type="range" id="score2" name="score2" min="0" max="10" value="5" step="0.5" class="rating-slider mixer-slider">
                    <span class="slider-value" id="score2-value">5</span>
                  </div>
                  <span class="error-message" id="score2-error"></span>
                </div>

                <div class="rating-group mixer-channel">
                  <label for="score3">Реализация стиля</label>
                  <div class="slider-container mixer-slider-container">
                    <input type="range" id="score3" name="score3" min="0" max="10" value="5" step="0.5" class="rating-slider mixer-slider">
                    <span class="slider-value" id="score3-value">5</span>
                  </div>
                  <span class="error-message" id="score3-error"></span>
                </div>

                <div class="rating-group mixer-channel">
                  <label for="score4">Личность / харизма</label>
                  <div class="slider-container mixer-slider-container">
                    <input type="range" id="score4" name="score4" min="0" max="10" value="5" step="0.5" class="rating-slider mixer-slider">
                    <span class="slider-value" id="score4-value">5</span>
                  </div>
                  <span class="error-message" id="score4-error"></span>
                </div>

                <div class="rating-group mixer-channel">
                  <label for="score5">Атмосфера / вайб</label>
                  <div class="slider-container mixer-slider-container">
                    <input type="range" id="score5" name="score5" min="0" max="10" value="5" step="0.5" class="rating-slider mixer-slider">
                    <span class="slider-value" id="score5-value">5</span>
                  </div>
                  <span class="error-message" id="score5-error"></span>
                </div>
              </div>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="submit-btn">Отправить на модерацию</button>
          <div id="form-message" class="form-message"></div>
        </form>

        <aside class="release-preview-card" aria-label="Предпросмотр карточки">
          <div class="release-preview-cover-wrap">
            <img id="release-live-cover" src="svg/album.png" alt="Предпросмотр обложки" class="release-preview-cover" onerror="this.onerror=null; this.src='svg/album.png';">
          </div>
          <div class="release-preview-meta">
            <div id="release-live-type" class="release-preview-type">Сингл</div>
            <h3 id="release-live-title">Название релиза</h3>
            <p id="release-live-artist">Исполнитель</p>
            <p id="release-live-date" class="release-preview-date">Дата релиза не указана</p>
          </div>
          <div class="release-preview-scores" id="release-live-scores">Средняя оценка: 5.0</div>
        </aside>
      </div>
    </div>
  </div>

  <script src="js/nav-mobile.js" defer></script>
  <script type="module" src="js/submit-release.js"></script>
</body>
</html>
