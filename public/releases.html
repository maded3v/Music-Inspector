 <div class="container">

<script src="js/nav-mobile.js?v=20260408" defer></script>
<script type="module">
import { getReleases } from './js/api.js?v=20260406';
import { renderReleaseCardAll } from './js/releases.js?v=20260407';
import { initAuthStatus } from './js/auth-status.js?v=20260404';

let allReleases = [];
let currentSort = 'people-rating';
let currentOrder = 'desc';
let navSearchInput = null;

function getSearchValue() {
  return (navSearchInput?.value || '').toLowerCase().trim();
}

function renderReleases(releases) {
  const grid = document.querySelector('.releases-grid');
  const searchValue = getSearchValue();

  const filtered = releases.filter((r) => {
    const title = (r.title || '').toLowerCase();
    const artist = (r.artist || '').toLowerCase();
    return title.includes(searchValue) || artist.includes(searchValue);
  });

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="releases-empty">Ничего не найдено. Попробуйте изменить поиск или сортировку.</div>';
    return;
  }

  const sorted = sortReleases(filtered, currentSort, currentOrder);
  grid.innerHTML = sorted.map(renderReleaseCardAll).join('');
}

function getReleaseDateValue(release) {
  const dateValue = release.created_at || release.releaseDate || release.createdAt || null;
  if (!dateValue) {
    return 0;
  }

  const timestamp = new Date(dateValue).getTime();
  return Number.isNaN(timestamp) ? 0 : timestamp;
}

function getReleaseRatingValue(release) {
  const people = Number(release.peopleScore);
  const mi = Number(release.miScore);

  if (Number.isFinite(people) && Number.isFinite(mi)) {
    return (people + mi) / 2;
  }

  if (Number.isFinite(people)) {
    return people;
  }

  if (Number.isFinite(mi)) {
    return mi;
  }

  const legacy = Number(release.score);
  return Number.isFinite(legacy) ? legacy : 0;
}

function getPeopleRatingValue(release) {
  const people = Number(release.peopleScore);
  if (Number.isFinite(people)) {
    return people;
  }

  const combined = getReleaseRatingValue(release);
  return Number.isFinite(combined) ? combined : 0;
}

function getMiRatingValue(release) {
  const mi = Number(release.miScore);
  if (Number.isFinite(mi)) {
    return mi;
  }

  const combined = getReleaseRatingValue(release);
  return Number.isFinite(combined) ? combined : 0;
}

function sortReleases(releases, sortBy, order) {
  return [...releases].sort((a, b) => {
    let valA;
    let valB;

    switch (sortBy) {
      case 'people-rating':
        valA = getPeopleRatingValue(a);
        valB = getPeopleRatingValue(b);
        break;
      case 'mi-rating':
        valA = getMiRatingValue(a);
        valB = getMiRatingValue(b);
        break;
      case 'rating':
        valA = getReleaseRatingValue(a);
        valB = getReleaseRatingValue(b);
        break;
      case 'date':
        valA = getReleaseDateValue(a);
        valB = getReleaseDateValue(b);
        break;
      case 'alphabet':
        valA = (a.title || '').toLowerCase();
        valB = (b.title || '').toLowerCase();
        break;
      default:
        return 0;
    }

    if (sortBy === 'alphabet') {
      return order === 'asc'
        ? valA.localeCompare(valB, 'ru', { sensitivity: 'base' })
        : valB.localeCompare(valA, 'ru', { sensitivity: 'base' });
    }

    if (valA === valB) {
      return 0;
    }

    if (order === 'asc') {
      return valA > valB ? 1 : -1;
    }

    return valA < valB ? 1 : -1;
  });
}

function updateSortButtonState() {
  document.querySelectorAll('.sort-btn').forEach((btn) => {
    const isActive = btn.dataset.sort === currentSort;
    btn.classList.toggle('is-active', isActive);
    const baseLabel = btn.dataset.label || btn.textContent.replace(/\s[↑↓]$/, '');
    const orderLabel = isActive ? (currentOrder === 'asc' ? ' ↑' : ' ↓') : '';
    btn.textContent = baseLabel + orderLabel;
  });
}

document.addEventListener('DOMContentLoaded', async () => {
  // Initialize auth status
  await initAuthStatus();

  navSearchInput = document.querySelector('.search-bar .search-input');
  
  allReleases = await getReleases();
  
  // Check for search parameter in URL
  const urlParams = new URLSearchParams(window.location.search);
  const searchQuery = urlParams.get('search');
  if (searchQuery && navSearchInput) {
    navSearchInput.value = searchQuery;
  }
  
  updateSortButtonState();
  renderReleases(allReleases);

  if (navSearchInput) {
    navSearchInput.addEventListener('input', () => {
      renderReleases(allReleases);
    });
  }

  document.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sortBy = btn.dataset.sort;
      if (currentSort === sortBy) {
        currentOrder = currentOrder === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort = sortBy;
        currentOrder = 'desc';
      }

      updateSortButtonState();
      renderReleases(allReleases);
    });
  });
});
</script>
