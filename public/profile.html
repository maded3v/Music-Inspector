<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Inspector - Профиль</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
      .profile-container {
        max-width: 1122px;
        margin: 30px auto;
        padding: 0 20px;
      }
      .profile-layout {
        display: flex;
        gap: 24px;
      }
      .profile-left {
        flex: 1;
        min-width: 300px;
      }
      .profile-right {
        width: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
      }
      .profile-avatar-large {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        color: white;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .profile-avatar-large img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .profile-name {
        font-size: 1.8em;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .profile-email {
        color: #969696;
        margin-bottom: 5px;
      }
      .profile-role {
        color: #4CAF50;
        margin-bottom: 20px;
      }
      .profile-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }
      .profile-btn {
        padding: 10px 12px;
        border: 1px solid #1e1e1e;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        transition: color 0.3s, background-color 0.3s, border-color 0.3s;
        text-align: center;
        user-select: none;
        text-decoration: none;
      }
      .profile-btn-avatar {
        background: #282828;
        color: white;
      }
      .profile-btn-avatar:hover {
        background-color: #E1E1E1;
        color: #969696;
        border: #969696 1px solid;
      }
      .profile-btn-logout {
        background: #282828;
        color: white;
      }
      .profile-btn-logout:hover {
        background-color: #E1E1E1;
        color: #969696;
        border: #969696 1px solid;
      }
      .stats-section {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #333;
        margin-bottom: 30px;
      }
      .stats-section h3 {
        margin: 0 0 20px 0;
        font-size: 1.2em;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .stat-item {
        text-align: center;
      }
      .stat-value {
        font-size: 1.5em;
        font-weight: bold;
        color: #fff;
      }
      .stat-label {
        font-size: 0.85em;
        color: #969696;
        margin-top: 5px;
      }
      .last-review-section {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #333;
        margin-bottom: 20px;
      }
      .last-review-section h3 {
        margin: 0 0 20px 0;
        font-size: 1.2em;
      }
      .review-card-profile {
        background: #252525;
        padding: 15px;
        border-radius: 8px;
        display: flex;
        gap: 15px;
        align-items: center;
        cursor: pointer;
        transition: background 0.2s;
        text-decoration: none;
        color: inherit;
      }
      .review-card-profile:hover {
        background: #303030;
      }
      .review-cover-small {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .review-info {
        flex: 1;
        min-width: 0;
      }
      .review-track-title {
        font-weight: bold;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .review-text-preview {
        color: #969696;
        font-size: 0.9em;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .review-score-large {
        font-size: 2em;
        font-weight: bold;
        text-align: right;
      }
      .pending-reviews-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .pending-review-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        background: #252525;
        border-radius: 8px;
        border: 1px solid #383838;
        padding: 10px 12px;
      }
      .pending-review-track {
        font-size: 0.95rem;
        color: #d9d9d9;
        text-align: left;
      }
      .pending-review-date {
        font-size: 0.85rem;
        color: #969696;
      }
      .pending-review-badge {
        border: 1px solid #ff9800;
        color: #ffb14b;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .all-reviews-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.9);
        z-index: 1000;
        overflow-y: auto;
        padding: 40px 20px;
      }
      .all-reviews-content {
        max-width: 800px;
        margin: 0 auto;
      }
      .all-reviews-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .all-reviews-header h2 {
        margin: 0;
      }
      .close-modal-btn {
        background: #444;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }
      .close-modal-btn:hover {
        background: #555;
      }
      .reviews-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .no-reviews {
        text-align: center;
        color: #969696;
        padding: 40px;
      }
    </style>
</head>
<body>
  <div class="nav-bar">
    <a href="index.html">
      <div class="svg-logo"><svg fill="#D9D9D9" width="45px" height="45px" viewBox="0 0 256 256" id="Flat" xmlns="http://www.w3.org/2000/svg">
        <path d="M188.29883,43.31128a8.00224,8.00224,0,0,0-1.35889-.94751,103.67838,103.67838,0,1,0,1.35889.94751ZM128,152a24,24,0,1,1,24-24A24.0275,24.0275,0,0,1,128,152Zm88-24c0,2.47168-.10791,4.91833-.30859,7.339l-47.71875-8.41419a39.84182,39.84182,0,0,0-10.95777-26.41552l27.77808-39.671A87.83762,87.83762,0,0,1,216,128Z"/>
      </svg></div>
      <div class="name-logo">Music Inspector</div>
    </a>
    <a href="about-us.html">
      <div class="about-us-but"><svg fill="#969696" width="25px" height="25px" viewBox="-3 0 19 19" xmlns="http://www.w3.org/2000/svg" class="cf-icon-svg"><path d="M12.517 12.834v1.9a1.27 1.27 0 0 1-1.267 1.267h-9.5a1.27 1.27 0 0 1-1.267-1.267v-1.9A3.176 3.176 0 0 1 3.65 9.667h5.7a3.176 3.176 0 0 1 3.167 3.167zM3.264 5.48A3.236 3.236 0 1 1 6.5 8.717a3.236 3.236 0 0 1-3.236-3.236z"/></svg></div>
    </a>
    <div class="search-bar">
      <div class="search-icon">
        <svg stroke="currentColor" fill="#969696" stroke-width="0" viewBox="0 0 512 512" class="size-4" height="25px" width="25px" xmlns="http://www.w3.org/2000/svg"><path d="M337.509 305.372h-17.501l-6.571-5.486c20.791-25.232 33.922-57.054 33.922-93.257C347.358 127.632 283.896 64 205.135 64 127.452 64 64 127.632 64 206.629s63.452 142.628 142.225 142.628c35.011 0 67.831-13.167 92.991-34.008l6.561 5.487v17.551L415.18 448 448 415.086 337.509 305.372zm-131.284 0c-54.702 0-98.463-43.887-98.463-98.743 0-54.858 43.761-98.742 98.463-98.742 54.7 0 98.462 43.884 98.462 98.742 0 54.856-43.762 98.743-98.462 98.743z"></path></svg>
      </div>
      <input type="text" class="search-input" placeholder="Поиск...">
    </div>
    <!-- Auth buttons (shown when not logged in) -->
    <a href="login.html" class="sing-in-but auth-buttons">Войти</a>
    <a href="register.html" class="sing-up-but auth-buttons">Регистрация</a>
    
    <!-- Profile button (shown when logged in) -->
    <div class="profile-section" style="display: none;">
      <span class="profile-nickname" id="profile-nickname"></span>
      <a href="profile.html" class="profile-avatar-link">
        <div class="profile-avatar" id="profile-avatar"></div>
      </a>
    </div>
  </div>

  <div class="profile-container">
    <div id="profile-content">
      <p style="text-align: center;">Загрузка...</p>
    </div>
  </div>

  <script src="js/nav-mobile.js" defer></script>
  <script type="module">
    import {
      getCurrentUser,
      uploadAvatar,
      getUserReviews,
      getUserStats,
      resolveMediaUrl,
      updateMyName,
      getPublicUserProfile
    } from './js/api.js';
    import { handleLogout } from './js/auth-refactored.js';
    import { initGlobalSearch } from './js/search.js';

    const urlParams = new URLSearchParams(window.location.search);
    const requestedProfileId = Number.parseInt(urlParams.get('id') || '', 10);

    let currentUser = null;

    await initGlobalSearch();

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function generateAvatarColor(seed) {
      const source = String(seed || 'music-inspector');
      let hash = 0;
      for (let i = 0; i < source.length; i++) {
        hash = source.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash % 360);
      const saturation = 58 + (Math.abs(hash) % 18);
      const lightness = 42 + (Math.abs(hash) % 12);
      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function getNickname(value) {
      if (!value) return '';
      const normalized = String(value);
      return normalized.includes('@') ? normalized.split('@')[0] : normalized;
    }

    function getFirstLetter(value) {
      if (!value) return '?';
      return String(value).trim().charAt(0).toUpperCase() || '?';
    }

    function resolveAvatarPath(avatar) {
      if (!avatar) return '';
      const normalized = String(avatar).trim();
      if (!normalized) return '';
      if (normalized.startsWith('http://') || normalized.startsWith('https://') || normalized.startsWith('/')) {
        return resolveMediaUrl(normalized);
      }
      if (normalized.startsWith('uploads/')) {
        return resolveMediaUrl(normalized);
      }
      return resolveMediaUrl(`uploads/avatars/${normalized}`);
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      if (Number.isNaN(date.getTime())) {
        return '—';
      }
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function updateAuthStatus(user) {
      const authButtons = document.querySelectorAll('.auth-buttons');
      const profileSection = document.querySelector('.profile-section');
      const profileAvatar = document.getElementById('profile-avatar');
      const profileNickname = document.getElementById('profile-nickname');

      if (!user) {
        authButtons.forEach((btn) => {
          btn.style.display = 'flex';
        });
        if (profileSection) {
          profileSection.style.display = 'none';
        }
        return;
      }

      authButtons.forEach((btn) => {
        btn.style.display = 'none';
      });

      if (!profileSection) {
        return;
      }

      profileSection.style.display = 'flex';
      const nickname = getNickname(user.name || user.email);
      if (profileNickname) {
        profileNickname.textContent = nickname;
      }

      if (!profileAvatar) {
        return;
      }

      if (user.avatar) {
        const avatarPath = resolveAvatarPath(user.avatar);
        profileAvatar.innerHTML = `<img src="${avatarPath}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" onerror="this.onerror=null; this.style.display='none'; this.parentElement.textContent='${getFirstLetter(nickname)}'; this.parentElement.style.backgroundColor='${generateAvatarColor(user.email || user.name)}';">`;
      } else {
        profileAvatar.innerHTML = '';
        profileAvatar.textContent = getFirstLetter(nickname);
        profileAvatar.style.backgroundColor = generateAvatarColor(user.email || user.name);
      }
    }

    function showMessage(text, type) {
      const messageDiv = document.createElement('div');
      messageDiv.style.cssText = `
        position: fixed;
        top: 80px;
        right: 20px;
        padding: 15px 25px;
        border-radius: 8px;
        color: white;
        z-index: 1001;
        background: ${type === 'success' ? '#4CAF50' : '#f44336'};
      `;
      messageDiv.textContent = text;
      document.body.appendChild(messageDiv);
      setTimeout(() => messageDiv.remove(), 3000);
    }

    function renderReviewCard(review) {
      const score = Number(review.avg_score);
      const displayScore = Number.isFinite(score) ? score.toFixed(1) : '—';
      const statusColor = {
        pending: '#ff9800',
        approved: '#4CAF50',
        rejected: '#f44336'
      }[review.status] || '#4CAF50';

      const coverUrl = resolveMediaUrl(review.track_cover) || 'svg/album.png';
      const title = `${review.track_title || 'Трек'} - ${review.track_artist || 'Исполнитель'}`;
      const preview = review.text || 'Нет текста';

      return `
        <a href="track.html?id=${review.track_id}" class="review-card-profile">
          <img src="${coverUrl}" alt="Cover" class="review-cover-small" onerror="this.onerror=null; this.src='svg/album.png';">
          <div class="review-info">
            <div class="review-track-title">${escapeHtml(title)}</div>
            <div class="review-text-preview">${escapeHtml(preview)}</div>
          </div>
          <div class="review-score-large" style="color: ${statusColor};">${displayScore}</div>
        </a>
      `;
    }

    function renderProfileView(user, stats, reviews, ownProfile) {
      const profileContent = document.getElementById('profile-content');
      const avatarPath = resolveAvatarPath(user.avatar || '');
      const nickname = getNickname(user.name || user.email);
      const firstLetter = getFirstLetter(nickname);
      const bgColor = generateAvatarColor(user.email || user.name || user.id);

      const pendingReviews = ownProfile ? reviews.filter((review) => review.status === 'pending') : [];
      const visibleReviews = ownProfile
        ? reviews.filter((review) => review.status !== 'pending')
        : reviews;

      const allReviewsMarkup = visibleReviews.length > 0
        ? `<div class="reviews-list">${visibleReviews.map(renderReviewCard).join('')}</div>`
        : '<div class="no-reviews">Пока нет отзывов</div>';

      const pendingReviewsMarkup = ownProfile
        ? pendingReviews.length > 0
          ? `<div class="pending-reviews-list">
              ${pendingReviews.slice(0, 8).map((review) => `
                <div class="pending-review-item">
                  <div>
                    <div class="pending-review-track">${escapeHtml(review.track_title || 'Трек')} - ${escapeHtml(review.track_artist || 'Исполнитель')}</div>
                    <div class="pending-review-date">${formatDate(review.created_at)}</div>
                  </div>
                  <div class="pending-review-badge">На проверке</div>
                </div>
              `).join('')}
            </div>`
          : '<div class="no-reviews" style="padding: 18px 0;">Нет отзывов на проверке</div>'
        : '';

      const statsFavorite = stats.favoriteArtist || '—';
      const roleText = ownProfile
        ? (user.role === 'admin' ? 'Администратор' : 'Пользователь')
        : 'Публичный профиль';

      profileContent.innerHTML = `
        <div class="profile-layout">
          <div class="profile-left">
            <div class="stats-section">
              <h3>Статистика</h3>
              <div class="stats-grid">
                <div class="stat-item">
                  <div class="stat-value">${stats.registrationDate ? formatDate(stats.registrationDate) : '—'}</div>
                  <div class="stat-label">Дата регистрации</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value">${Number(stats.reviewCount || 0)}</div>
                  <div class="stat-label">Отзывы</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value" style="font-size: ${String(statsFavorite).length > 15 ? '1em' : '1.5em'};">${escapeHtml(statsFavorite)}</div>
                  <div class="stat-label">Любимый артист</div>
                </div>
              </div>
            </div>

            ${ownProfile ? `
              <div class="last-review-section">
                <h3>Отзывы на проверке</h3>
                ${pendingReviewsMarkup}
              </div>
            ` : ''}

            <div class="last-review-section">
              <h3>Все отзывы пользователя</h3>
              ${allReviewsMarkup}
            </div>
          </div>

          <div class="profile-right">
            <div class="profile-avatar-large" style="background-color: ${bgColor};">
              ${avatarPath ? `<img src="${avatarPath}" alt="Avatar" onerror="this.onerror=null; this.style.display='none'; this.parentElement.textContent='${firstLetter}';">` : firstLetter}
            </div>
            <div class="profile-name">${escapeHtml(user.name || nickname || 'Пользователь')}</div>
            <div class="profile-email">${ownProfile ? escapeHtml(user.email || '') : ''}</div>
            <div class="profile-role">${roleText}</div>

            ${ownProfile ? `
              <div class="profile-buttons">
                <label for="avatar-upload" class="profile-btn profile-btn-avatar">Загрузить аватар</label>
                <input type="file" id="avatar-upload" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" style="display: none;" />
                <button id="rename-btn" class="profile-btn profile-btn-avatar">Сменить ник</button>
                <button id="logout-btn" class="profile-btn profile-btn-logout">Выйти</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    async function handleAvatarUpload(file) {
      try {
        const result = await uploadAvatar(file);
        if (!result?.success) {
          throw new Error('Ошибка загрузки аватара');
        }

        if (currentUser && result.avatarPath) {
          currentUser.avatar = result.avatarPath;
        }

        const refreshedUser = await getCurrentUser();
        if (refreshedUser) {
          currentUser = {
            ...refreshedUser,
            avatar: refreshedUser.avatar || currentUser?.avatar || null
          };
        }

        updateAuthStatus(currentUser);
        await loadOwnProfile();
        showMessage('Аватар успешно загружен', 'success');
      } catch (error) {
        console.error('Avatar upload error:', error);
        showMessage(`Ошибка загрузки аватара: ${error.message || 'Неизвестная ошибка'}`, 'error');
      }
    }

    function bindOwnProfileActions(user) {
      const avatarUpload = document.getElementById('avatar-upload');
      if (avatarUpload) {
        avatarUpload.addEventListener('change', (event) => {
          const file = event.target.files?.[0];
          if (!file) return;

          const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
          const maxSize = 5 * 1024 * 1024;

          if (!allowedTypes.includes(file.type)) {
            showMessage('Допустимые форматы: JPG, PNG, WebP', 'error');
            avatarUpload.value = '';
            return;
          }

          if (file.size > maxSize) {
            showMessage('Максимальный размер файла: 5MB', 'error');
            avatarUpload.value = '';
            return;
          }

          handleAvatarUpload(file);
        });
      }

      const renameBtn = document.getElementById('rename-btn');
      if (renameBtn) {
        renameBtn.addEventListener('click', async () => {
          const initialValue = String(user.name || getNickname(user.email) || '').trim();
          const nextName = prompt('Введите новый ник:', initialValue);
          if (!nextName) return;

          const normalized = nextName.trim();
          if (normalized.length < 2 || normalized.length > 80) {
            showMessage('Ник должен быть от 2 до 80 символов', 'error');
            return;
          }

          try {
            await updateMyName(normalized);
            const refreshedUser = await getCurrentUser();
            if (refreshedUser) {
              currentUser = refreshedUser;
              updateAuthStatus(currentUser);
            }
            await loadOwnProfile();
            showMessage('Ник обновлен', 'success');
          } catch (error) {
            console.error('Rename error:', error);
            showMessage(`Ошибка смены ника: ${error.message || 'Unknown error'}`, 'error');
          }
        });
      }

      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          await handleLogout();
        });
      }
    }

    async function loadOwnProfile() {
      if (!currentUser) {
        return;
      }

      let stats = { registrationDate: null, reviewCount: 0, favoriteArtist: null };
      let reviews = [];

      try {
        const statsData = await getUserStats(currentUser.id);
        stats = statsData?.stats || stats;
      } catch (error) {
        console.error('Error loading own stats:', error);
      }

      try {
        const reviewsData = await getUserReviews(currentUser.id);
        reviews = reviewsData?.reviews || [];
      } catch (error) {
        console.error('Error loading own reviews:', error);
      }

      renderProfileView(currentUser, stats, reviews, true);
      bindOwnProfileActions(currentUser);
    }

    async function loadPublicProfile(userId) {
      const profileContent = document.getElementById('profile-content');
      try {
        const data = await getPublicUserProfile(userId);
        const publicUser = data?.user;
        if (!publicUser) {
          throw new Error('Профиль не найден');
        }

        const stats = data?.stats || { registrationDate: publicUser.created_at, reviewCount: 0, favoriteArtist: null };
        const reviews = Array.isArray(data?.reviews) ? data.reviews : [];

        renderProfileView(publicUser, stats, reviews, false);
      } catch (error) {
        console.error('Error loading public profile:', error);
        profileContent.innerHTML = '<div class="no-reviews">Профиль не найден или недоступен</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      currentUser = await getCurrentUser();
      updateAuthStatus(currentUser);

      const hasRequestedProfile = Number.isInteger(requestedProfileId) && requestedProfileId > 0;
      const ownProfile = Boolean(currentUser && (!hasRequestedProfile || requestedProfileId === currentUser.id));

      if (ownProfile) {
        await loadOwnProfile();
        return;
      }

      if (hasRequestedProfile) {
        await loadPublicProfile(requestedProfileId);
        return;
      }

      window.location.href = 'login.html';
    });
  </script>
</body>
