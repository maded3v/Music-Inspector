<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Inspector - Профиль</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
      .profile-container {
        max-width: 1122px;
        margin: 30px auto;
        padding: 0 20px;
      }
      .profile-layout {
        display: flex;
        gap: 24px;
      }
      .profile-left {
        flex: 1;
        min-width: 300px;
      }
      .profile-right {
        width: 300px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        box-sizing: border-box;
      }
      .profile-avatar-large {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
        color: white;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .profile-avatar-large img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .profile-name {
        font-size: 1.8em;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .profile-email {
        color: #969696;
        margin-bottom: 5px;
      }
      .profile-role {
        color: #4CAF50;
        margin-bottom: 20px;
      }
      .profile-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }
      .profile-btn {
        padding: 10px 12px;
        border: 1px solid #1e1e1e;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        transition: color 0.3s, background-color 0.3s, border-color 0.3s;
        text-align: center;
        user-select: none;
        text-decoration: none;
      }
      .profile-btn-avatar {
        background: #282828;
        color: white;
      }
      .profile-btn-avatar:hover {
        background-color: #E1E1E1;
        color: #969696;
        border: #969696 1px solid;
      }
      .profile-btn-logout {
        background: #282828;
        color: white;
      }
      .profile-btn-logout:hover {
        background-color: #E1E1E1;
        color: #969696;
        border: #969696 1px solid;
      }
      .stats-section {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #333;
        margin-bottom: 30px;
      }
      .stats-section h3 {
        margin: 0 0 20px 0;
        font-size: 1.2em;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .stat-item {
        text-align: center;
      }
      .stat-value {
        font-size: 1.5em;
        font-weight: bold;
        color: #fff;
      }
      .stat-label {
        font-size: 0.85em;
        color: #969696;
        margin-top: 5px;
      }
      .last-review-section {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #333;
        margin-bottom: 20px;
      }
      .last-review-section h3 {
        margin: 0 0 20px 0;
        font-size: 1.2em;
      }
      .review-card-profile {
        background: #252525;
        padding: 15px;
        border-radius: 8px;
        display: flex;
        gap: 15px;
        align-items: center;
        cursor: pointer;
        transition: background 0.2s;
        text-decoration: none;
        color: inherit;
      }
      .review-card-profile:hover {
        background: #303030;
      }
      .review-cover-small {
        width: 80px;
        height: 80px;
        object-fit: cover;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .review-info {
        flex: 1;
        min-width: 0;
      }
      .review-track-title {
        font-weight: bold;
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .review-text-preview {
        color: #969696;
        font-size: 0.9em;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .review-score-large {
        font-size: 2em;
        font-weight: bold;
        text-align: right;
      }
      .pending-reviews-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .pending-review-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        background: #252525;
        border-radius: 8px;
        border: 1px solid #383838;
        padding: 10px 12px;
      }
      .pending-review-track {
        font-size: 0.95rem;
        color: #d9d9d9;
        text-align: left;
      }
      .pending-review-date {
        font-size: 0.85rem;
        color: #969696;
      }
      .pending-review-badge {
        border: 1px solid #ff9800;
        color: #ffb14b;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.8rem;
        white-space: nowrap;
      }
      .all-reviews-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.9);
        z-index: 1000;
        overflow-y: auto;
        padding: 40px 20px;
      }
      .all-reviews-content {
        max-width: 800px;
        margin: 0 auto;
      }
      .all-reviews-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
      }
      .all-reviews-header h2 {
        margin: 0;
      }
      .close-modal-btn {
        background: #444;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
      }
      .close-modal-btn:hover {
        background: #555;
      }
      .reviews-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .no-reviews {
        text-align: center;
        color: #969696;
        padding: 40px;
      }
    </style>
</head>
<body>
  <div class="nav-bar">
    <a href="index.html">
      <div class="svg-logo"><svg fill="#D9D9D9" width="45px" height="45px" viewBox="0 0 256 256" id="Flat" xmlns="http://www.w3.org/2000/svg">
        <path d="M188.29883,43.31128a8.00224,8.00224,0,0,0-1.35889-.94751,103.67838,103.67838,0,1,0,1.35889.94751ZM128,152a24,24,0,1,1,24-24A24.0275,24.0275,0,0,1,128,152Zm88-24c0,2.47168-.10791,4.91833-.30859,7.339l-47.71875-8.41419a39.84182,39.84182,0,0,0-10.95777-26.41552l27.77808-39.671A87.83762,87.83762,0,0,1,216,128Z"/>
      </svg></div>
      <div class="name-logo">Music Inspector</div>
    </a>
    <a href="about-us.html">
      <div class="about-us-but"><svg fill="#969696" width="px" height="25px" viewBox="-3 0 19 19" xmlns="http://www.w3.org/2000/svg" class="cf-icon-svg"><path d="M12.517 12.834v1.9a1.27 1.27 0 0 1-1.267 1.267h-9.5a1.27 1.27 0 0 1-1.267-1.267v-1.9A3.176 3.176 0 0 1 3.65 9.667h5.7a3.176 3.176 0 0 1 3.167 3.167zM3.264 5.48A3.236 3.236 0 1 1 6.5 8.717a3.236 3.236 0 0 1-3.236-3.236z"/></svg></div>
    </a>
    <div class="search-bar">
      <div class="search-icon">
        <svg stroke="currentColor" fill="#969696" stroke-width="0" viewBox="0 0 512 512" class="size-4" height="25px" width="25px" xmlns="http://www.w3.org/2000/svg"><path d="M337.509 305.372h-17.501l-6.571-5.486c20.791-25.232 33.922-57.054 33.922-93.257C347.358 127.632 283.896 64 205.135 64 127.452 64 64 127.632 64 206.629s63.452 142.628 142.225 142.628c35.011 0 67.831-13.167 92.991-34.008l6.561 5.487v17.551L415.18 448 448 415.086 337.509 305.372zm-131.284 0c-54.702 0-98.463-43.887-98.463-98.743 0-54.858 43.761-98.742 98.463-98.742 54.7 0 98.462 43.884 98.462 98.742 0 54.856-43.762 98.743-98.462 98.743z"></path></svg>
      </div>
      <input type="text" class="search-input" placeholder="Поиск...">
    </div>
    <!-- Auth buttons (shown when not logged in) -->
    <a href="login.html" class="sing-in-but auth-buttons">Войти</a>
    <a href="register.html" class="sing-up-but auth-buttons">Регистрация</a>
    
    <!-- Profile button (shown when logged in) -->
    <div class="profile-section" style="display: none;">
      <span class="profile-nickname" id="profile-nickname"></span>
      <a href="profile.html" class="profile-avatar-link">
        <div class="profile-avatar" id="profile-avatar"></div>
      </a>
    </div>
  </div>

  <div class="profile-container">
    <div id="profile-content">
      <p style="text-align: center;">Загрузка...</p>
    </div>
  </div>

  <script src="js/nav-mobile.js" defer></script>
  <script type="module">
    import { getCurrentUser, uploadAvatar, getUserReviews, getUserStats } from './js/api.js';
    import { handleLogout } from './js/auth-refactored.js';
    import { initGlobalSearch } from './js/search.js';
    
    let allReviews = [];

    await initGlobalSearch();
    
    function generateAvatarColor(email) {
      let hash = 0;
      for (let i = 0; i < email.length; i++) {
        hash = email.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash % 360);
      const saturation = 60 + (Math.abs(hash) % 20);
      const lightness = 45 + (Math.abs(hash) % 15);
      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }
    
    function getNickname(email) {
      if (!email) return '';
      return email.split('@')[0];
    }
    
    function getFirstLetter(name) {
      if (!name) return '?';
      return name.charAt(0).toUpperCase();
    }
    
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    }
    
    function updateAuthStatus(user) {
      const authButtons = document.querySelectorAll('.auth-buttons');
      const profileSection = document.querySelector('.profile-section');
      const profileAvatar = document.getElementById('profile-avatar');
      const profileNickname = document.getElementById('profile-nickname');
      
      if (user) {
        authButtons.forEach(btn => btn.style.display = 'none');
        if (profileSection) {
          profileSection.style.display = 'flex';
          const nickname = getNickname(user.email || user.name);
          if (profileNickname) {
            profileNickname.textContent = nickname;
          }
          if (profileAvatar) {
            if (user.avatar) {
              let avatarPath = user.avatar;
              if (!avatarPath.startsWith('http://') && !avatarPath.startsWith('https://') && !avatarPath.startsWith('/')) {
                if (!avatarPath.startsWith('uploads/')) {
                  avatarPath = `uploads/avatars/${avatarPath}`;
                }
              }
              profileAvatar.innerHTML = `<img src="${avatarPath}" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;" onerror="this.onerror=null; this.style.display='none'; this.parentElement.textContent='${getFirstLetter(nickname)}'; this.parentElement.style.backgroundColor='${generateAvatarColor(user.email || user.name)}';">`;
            } else {
              const firstLetter = getFirstLetter(nickname);
              const bgColor = generateAvatarColor(user.email || user.name);
              profileAvatar.textContent = firstLetter;
              profileAvatar.style.backgroundColor = bgColor;
            }
          }
        }
      } else {
        authButtons.forEach(btn => btn.style.display = 'flex');
        if (profileSection) {
          profileSection.style.display = 'none';
        }
        window.location.href = 'login.html';
      }
    }
    
    async function handleAvatarUpload(file) {
      try {
        const result = await uploadAvatar(file);
        if (result.success) {
          const currentUser = await getCurrentUser();
          updateAuthStatus(currentUser);
          renderProfile(currentUser);
          showMessage('✓ Аватар успешно загружен!', 'success');
        }
      } catch (error) {
        console.error('Avatar upload error:', error);
        showMessage(`Ошибка загрузки аватара: ${error.message || 'Неизвестная ошибка'}`, 'error');
      }
    }
    
    function showMessage(text, type) {
      const messageDiv = document.createElement('div');
      messageDiv.style.cssText = `
        position: fixed;
        top: 80px;
        right: 20px;
        padding: 15px 25px;
        border-radius: 8px;
        color: white;
        z-index: 1001;
        background: ${type === 'success' ? '#4CAF50' : '#f44336'};
      `;
      messageDiv.textContent = text;
      document.body.appendChild(messageDiv);
      setTimeout(() => messageDiv.remove(), 3000);
    }
    
    function renderReviewCard(review) {
      const statusColor = {
        'pending': '#ff9800',
        'approved': '#4CAF50',
        'rejected': '#f44336'
      }[review.status] || '#4CAF50';
      
      return `
        <a href="track.html?id=${review.track_id}" class="review-card-profile">
          <img src="${review.track_cover || 'svg/album.png'}" alt="Cover" class="review-cover-small" onerror="this.src='svg/album.png'">
          <div class="review-info">
            <div class="review-track-title">${review.track_title} - ${review.track_artist}</div>
            <div class="review-text-preview">${review.text || 'Нет текста'}</div>
          </div>
          <div class="review-score-large" style="color: ${statusColor};">${review.avg_score}</div>
        </a>
      `;
    }
    
    async function renderProfile(user) {
      const profileContent = document.getElementById('profile-content');
      
      // Get avatar path
      let avatarPath = user.avatar || null;
      if (avatarPath && !avatarPath.startsWith('http://') && !avatarPath.startsWith('https://') && !avatarPath.startsWith('/')) {
        if (!avatarPath.startsWith('uploads/')) {
          avatarPath = `uploads/avatars/${avatarPath}`;
        }
      }
      
      const nickname = getNickname(user.email || user.name);
      const firstLetter = getFirstLetter(nickname);
      const bgColor = generateAvatarColor(user.email || user.name);
      
      // Load stats and reviews
      let stats = { registrationDate: null, reviewCount: 0, favoriteArtist: null };
      try {
        const statsData = await getUserStats(user.id);
        stats = statsData.stats || stats;
      } catch (e) {
        console.error('Error loading stats:', e);
      }
      
      try {
        const reviewsData = await getUserReviews(user.id);
        allReviews = reviewsData.reviews || [];
      } catch (e) {
        console.error('Error loading reviews:', e);
        allReviews = [];
      }
      
      const pendingReviews = allReviews.filter((review) => review.status === 'pending');
      const approvedOrPublishedReviews = allReviews.filter((review) => review.status !== 'pending');
      const lastReview = approvedOrPublishedReviews.length > 0 ? approvedOrPublishedReviews[0] : null;

      const pendingReviewsMarkup = pendingReviews.length > 0
        ? `<div class="pending-reviews-list">
            ${pendingReviews.slice(0, 8).map((review) => `
              <div class="pending-review-item">
                <div>
                  <div class="pending-review-track">${review.track_title} - ${review.track_artist}</div>
                  <div class="pending-review-date">${formatDate(review.created_at)}</div>
                </div>
                <div class="pending-review-badge">На проверке</div>
              </div>
            `).join('')}
          </div>`
        : '<div class="no-reviews" style="padding: 18px 0;">Нет отзывов на проверке</div>';
      
      profileContent.innerHTML = `
        <div class="profile-layout">
          <div class="profile-left">
            <!-- Statistics -->
            <div class="stats-section">
              <h3>Статистика</h3>
              <div class="stats-grid">
                <div class="stat-item">
                  <div class="stat-value">${stats.registrationDate ? formatDate(stats.registrationDate) : '—'}</div>
                  <div class="stat-label">Дата регистрации</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value">${stats.reviewCount || 0}</div>
                  <div class="stat-label">Отзывов написано</div>
                </div>
                <div class="stat-item">
                  <div class="stat-value" style="font-size: ${stats.favoriteArtist && stats.favoriteArtist.length > 15 ? '1em' : '1.5em'};">${stats.favoriteArtist || '—'}</div>
                  <div class="stat-label">Любимый артист</div>
                </div>
              </div>
            </div>
            
            <!-- Last Review -->
            <div class="last-review-section">
              <h3>Последний отзыв</h3>
              ${lastReview ? renderReviewCard(lastReview) : '<div class="no-reviews">У вас пока нет отзывов</div>'}
            </div>

            <div class="last-review-section">
              <h3>Отзывы на проверке</h3>
              ${pendingReviewsMarkup}
            </div>
          </div>
          
          <div class="profile-right">
            <div class="profile-avatar-large" style="background-color: ${bgColor};">
              ${avatarPath ? `<img src="${avatarPath}" alt="Avatar" onerror="this.onerror=null; this.style.display='none'; this.parentElement.textContent='${firstLetter}';">` : firstLetter}
            </div>
            <div class="profile-name">${user.name || nickname}</div>
            <div class="profile-email">${user.email}</div>
            <div class="profile-role">${user.role === 'admin' ? 'Администратор' : 'Пользователь'}</div>
            
            <div class="profile-buttons">
              <label for="avatar-upload" class="profile-btn profile-btn-avatar">
                Загрузить аватар
              </label>
              <input type="file" id="avatar-upload" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" style="display: none;" />
              <button id="logout-btn" class="profile-btn profile-btn-logout">
                Выйти
              </button>
            </div>
          </div>
        </div>
      `;
      
      // Setup avatar upload
      const avatarUpload = document.getElementById('avatar-upload');
      if (avatarUpload) {
        avatarUpload.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
            const maxSize = 5 * 1024 * 1024;

            if (!allowedTypes.includes(file.type)) {
              showMessage('Допустимые форматы: JPG, PNG, WebP', 'error');
              avatarUpload.value = '';
              return;
            }

            if (file.size > maxSize) {
              showMessage('Максимальный размер файла: 5MB', 'error');
              avatarUpload.value = '';
              return;
            }

            handleAvatarUpload(file);
          }
        });
      }
      
      // Setup logout button
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
          await handleLogout();
        });
      }
    }
    
    document.addEventListener('DOMContentLoaded', async () => {
      const currentUser = await getCurrentUser();
      updateAuthStatus(currentUser);
      
      if (currentUser) {
        await renderProfile(currentUser);
      }
    });
  </script>
</body>
</html>
