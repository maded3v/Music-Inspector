      <span class="profile-nickname" id="profile-nickname"></span>

  <div class="container">
    <div class="release-page">
      <!-- Release Header Block -->
      <div class="release-header-block">
        <div class="release-cover-large">
          <img id="release-cover" src="svg/album.png" alt="Обложка релиза" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='svg/album.png';">
        </div>
        <div class="release-header-info">
          <div class="release-ratings-badge">
            <div class="rating-badge-item" id="people-rating-badge" style="display: none;">
              <span class="rating-label">Пользователи</span>
              <span class="rating-value" id="people-rating-value">0</span>
            </div>
            <div class="rating-badge-item" id="mi-rating-badge" style="display: none;">
              <span class="rating-label">MI</span>
              <span class="rating-value" id="mi-rating-value">0</span>
            </div>
          </div>
          <h1 id="release-title" class="release-title-large">Загрузка...</h1>
          <div class="release-artist-section">
            <a id="artist-link" href="#" class="artist-link">
              <img id="artist-avatar" src="svg/person.png" alt="Аватар исполнителя" class="artist-avatar" referrerpolicy="no-referrer" onerror="this.onerror=null; this.src='svg/person.png';">
              <span id="artist-name" class="artist-name">Загрузка...</span>
            </a>
          </div>
          <div id="release-date" class="release-date-large">Дата релиза: --.--.----</div>
        </div>

      <!-- Reviews Section -->
      <div class="release-reviews-section">
        <div class="reviews-header">
          <h2>Рецензии</h2>
          <div class="reviews-header-controls">
            <div id="review-sort-controls" class="review-sort-controls">
              <button type="button" class="review-sort-btn" data-sort="date">По дате</button>
              <button type="button" class="review-sort-btn" data-sort="score">По оценке</button>
              <button type="button" class="review-sort-btn" data-sort="likes">По лайкам</button>
            </div>
            <button id="add-review-btn" class="add-review-button" style="display: none;">+ Добавить рецензию</button>
          </div>
        </div>
        
        <!-- Add Review Form (hidden by default) -->
        <div id="add-review-form-container" class="add-review-form-container" style="display: none;">
          <div class="add-review-form-intro">
            <h3>Добавьте вашу рецензию</h3>
            <p>Оцените трек по 5 критериям и оставьте комментарий.</p>
          </div>
          <form id="review-form">
            <div class="ratings-section">
              <div class="rating-group">
                <label for="score1">Рифмы / образы</label>
                <div class="slider-container">
                  <input type="range" id="score1" name="score1" min="1" max="10" value="5" step="1" class="rating-slider">
                  <span class="slider-value" id="score1-value">5</span>
                </div>
              </div>
              <div class="rating-group">
                <label for="score2">Структура / ритм</label>
                <div class="slider-container">
                  <input type="range" id="score2" name="score2" min="1" max="10" value="5" step="1" class="rating-slider">
                  <span class="slider-value" id="score2-value">5</span>
                </div>
              </div>
              <div class="rating-group">
                <label for="score3">Реализация стиля</label>
                <div class="slider-container">
                  <input type="range" id="score3" name="score3" min="1" max="10" value="5" step="1" class="rating-slider">
                  <span class="slider-value" id="score3-value">5</span>
                </div>
              </div>
              <div class="rating-group">
                <label for="score4">Личность / харизма</label>
                <div class="slider-container">
                  <input type="range" id="score4" name="score4" min="1" max="10" value="5" step="1" class="rating-slider">
                  <span class="slider-value" id="score4-value">5</span>
                </div>
              </div>
              <div class="rating-group">
                <label for="score5">Атмосфера / вайб</label>
                <div class="slider-container">
                  <input type="range" id="score5" name="score5" min="1" max="10" value="5" step="1" class="rating-slider">
                  <span class="slider-value" id="score5-value">5</span>
                </div>
              </div>
            </div>
            <textarea name="text" placeholder="Ваша рецензия..." required></textarea>
            <div class="form-actions">
              <button type="submit">Опубликовать</button>
              <button type="button" id="cancel-review-btn">Отмена</button>
            </div>

        </div>

        <!-- Reviews List -->
        <div id="reviews-list" class="reviews-list">
          <!-- Reviews will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/nav-mobile.js?v=20260408" defer></script>
  <script type="module">
    import { getTrack, getReviewsByTrack, addReview, generateMIReview, voteReview, resolveMediaUrl } from './js/api.js?v=20260406';
    import { initAuth } from './js/auth-refactored.js';
    import { showErrorModal, showLoadingModal, showSuccessModal, closeModal } from './js/modal.js';

    const urlParams = new URLSearchParams(window.location.search);
    const trackId = urlParams.get('id');
    const targetReviewId = Number.parseInt(urlParams.get('review') || '', 10);
    let currentReviewSort = 'date';
    let currentReviewOrder = 'desc';
    let loadedTrackReviews = [];
    let hasScrolledToTargetReview = false;

    const REVIEW_SORT_LABELS = {
      date: 'По дате',
      score: 'По оценке',
      likes: 'По лайкам'
    };

    function updateSortButtonsLabels() {
      const controls = document.getElementById('review-sort-controls');
      if (!controls) {
        return;
      }

      const direction = currentReviewOrder === 'asc' ? '↑' : '↓';
      controls.querySelectorAll('.review-sort-btn').forEach((btn) => {
        const key = btn.dataset.sort;
        const label = REVIEW_SORT_LABELS[key] || btn.textContent;
        btn.textContent = key === currentReviewSort ? `${label} ${direction}` : label;
      });
    }

    if (!trackId) {
      window.location.href = 'index.html';
    }

    // Initialize auth status
    const currentUser = await initAuth();
    
    // Show add review button if logged in
    const addReviewBtn = document.getElementById('add-review-btn');
    const addReviewFormContainer = document.getElementById('add-review-form-container');
    if (currentUser && addReviewBtn) {
      addReviewBtn.style.display = 'block';
    }

    // Toggle add review form
    if (addReviewBtn) {
      addReviewBtn.addEventListener('click', () => {
        // Check if user is authenticated
        if (!currentUser) {
          showErrorModal(
            'Требуется авторизация',
            'Для написания рецензии необходимо войти в систему.',
            'Войти',
            () => {
              window.location.href = 'login.html';
            }
          );
          return;
        }
        addReviewFormContainer.style.display = addReviewFormContainer.style.display === 'none' ? 'block' : 'none';
      });
    }

    const cancelReviewBtn = document.getElementById('cancel-review-btn');
    if (cancelReviewBtn) {
      cancelReviewBtn.addEventListener('click', () => {
        addReviewFormContainer.style.display = 'none';
        document.getElementById('review-form').reset();
        // Reset slider values display
        for (let i = 1; i <= 5; i++) {
          const valueEl = document.getElementById(`score${i}-value`);
          if (valueEl) valueEl.textContent = '5';
        }
      });
    }

    // Initialize slider value displays
    for (let i = 1; i <= 5; i++) {
      const slider = document.getElementById(`score${i}`);
      const valueEl = document.getElementById(`score${i}-value`);
      if (slider && valueEl) {
        slider.addEventListener('input', () => {
          valueEl.textContent = slider.value;
        });
      }
    }

    // Load track data
    async function loadTrack() {
      try {
        const response = await getTrack(trackId);
        const track = response.track;

        if (!track) {
          throw new Error('Release data is empty');
        }

        // Fix cover image path
        const cover = resolveMediaUrl(track.cover || track.cover_path) || 'svg/album.png';

        document.getElementById('release-cover').src = cover;
        document.getElementById('release-title').textContent = track.title || 'Без названия';

        const releaseDateEl = document.getElementById('release-date');
        if (releaseDateEl) {
          const rawReleaseDate = track.release_date || track.releaseDate || track.created_at || null;
          if (rawReleaseDate) {
            const parsed = new Date(rawReleaseDate);
            if (!Number.isNaN(parsed.getTime())) {
              releaseDateEl.textContent = `Дата релиза: ${parsed.toLocaleDateString('ru-RU')}`;
            } else {
              releaseDateEl.textContent = 'Дата релиза: --.--.----';
            }
          } else {
            releaseDateEl.textContent = 'Дата релиза: --.--.----';
          }
        }
        
        // Artist information
        const artistName = track.artist_name || track.artist || 'Неизвестный исполнитель';
        const artistId = track.artist_id || null;
        const artistImage = track.artist_image || null;
        
        const artistLink = document.getElementById('artist-link');
        const artistNameEl = document.getElementById('artist-name');
        const artistAvatarEl = document.getElementById('artist-avatar');
        
        artistNameEl.textContent = artistName;
        
        if (artistId) {
          artistLink.href = `artist.html?id=${artistId}`;
          if (artistImage) {
            artistAvatarEl.src = resolveMediaUrl(artistImage);
          } else {
            artistAvatarEl.src = 'svg/person.png';
          }
        } else {
          artistLink.href = '#';
          artistLink.style.pointerEvents = 'none';
          artistAvatarEl.src = 'svg/person.png';
        }

        // Ratings badges
        const peopleRating = track.peopleScore;
        const miRating = track.miScore;

        const formatScore = (value) => {
          const num = parseFloat(value);
          if (Number.isNaN(num)) return '0';
          return Number.isInteger(num) ? String(num) : num.toFixed(1);
        };
        
        if (peopleRating !== null && peopleRating !== undefined) {
          document.getElementById('people-rating-value').textContent = formatScore(peopleRating);
          document.getElementById('people-rating-badge').style.display = 'flex';
        }
        
        if (miRating !== null && miRating !== undefined) {
          document.getElementById('mi-rating-value').textContent = formatScore(miRating);
          document.getElementById('mi-rating-badge').style.display = 'flex';
        }

        document.title = `${track.title} - ${artistName} | Music Inspector`;
      } catch (error) {
        console.error('Error loading track:', error);
        
        // Handle different error types
        const errorMessage = error.status === 404 
          ? 'Релиз не найден' 
          : error.status === 500 
          ? 'Ошибка сервера. Попробуйте позже.' 
          : error.message || 'Ошибка загрузки релиза';
        
        // Show error in UI instead of alert
        document.getElementById('release-title').textContent = 'Ошибка загрузки';
        document.getElementById('artist-name').textContent = errorMessage;
        document.getElementById('reviews-list').innerHTML = `<div class="no-reviews">${errorMessage}</div>`;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getAvatarUrl(avatar) {
      if (!avatar) return 'svg/person.png';
      if (avatar.startsWith('svg/')) return avatar;
      return resolveMediaUrl(avatar);
    }

    function getReviewScoreColor(score) {
      if (!Number.isFinite(score)) return '#C8C8C8';
      if (score >= 9) return '#4CAF50';
      if (score >= 5) return '#E3D323';
      return '#8b8b8b';
    }

    function sortTrackReviews(reviews) {
      const sorted = [...reviews];

      const applyOrder = (value) => currentReviewOrder === 'asc' ? value : -value;

      if (currentReviewSort === 'score') {
        sorted.sort((a, b) => {
          const aScore = Number(a.avg_score || 0);
          const bScore = Number(b.avg_score || 0);
          if (aScore !== bScore) return applyOrder(aScore - bScore);
          return applyOrder(new Date(a.created_at) - new Date(b.created_at));
        });
        return sorted;
      }

      if (currentReviewSort === 'likes') {
        sorted.sort((a, b) => {
          const aLikes = Number(a.helpful_score !== undefined ? a.helpful_score : (Number(a.upvotes || 0) - Number(a.downvotes || 0)));
          const bLikes = Number(b.helpful_score !== undefined ? b.helpful_score : (Number(b.upvotes || 0) - Number(b.downvotes || 0)));
          if (aLikes !== bLikes) return applyOrder(aLikes - bLikes);
          const aScore = Number(a.avg_score || 0);
          const bScore = Number(b.avg_score || 0);
          if (aScore !== bScore) return applyOrder(aScore - bScore);
          return applyOrder(new Date(a.created_at) - new Date(b.created_at));
        });
        return sorted;
      }

      sorted.sort((a, b) => applyOrder(new Date(a.created_at) - new Date(b.created_at)));
      return sorted;
    }

    function renderReviewCard(review) {
      const upvotes = Number(review.upvotes || 0);
      const downvotes = Number(review.downvotes || 0);
      const helpfulScore = Number(
        review.helpful_score !== undefined
          ? review.helpful_score
          : (upvotes - downvotes)
      );
      const myVote = Number(review.my_vote || 0);
      const scoreValue = Number(review.avg_score || 0);
      const scoreText = Number.isFinite(scoreValue) ? scoreValue.toFixed(1) : '0.0';

      return `
      <div class="review-card-track" data-review-id="${review.id}">
        <div class="review-header-track">
          <div class="review-author-track">
            ${review.user_id
              ? `<a href="profile.html?id=${review.user_id}" class="review-author-link-track">
                  <div class="review-avatar-track">
                    <img src="${getAvatarUrl(review.author_avatar)}" alt="avatar" onerror="this.onerror=null; this.src='svg/person.png';">
                  </div>
                  <div class="review-author-info">
                    <div class="review-author-name-track">
                      ${escapeHtml(review.author_name || (review.is_mi_review ? 'Music Inspector AI' : 'Пользователь'))}
                      ${review.is_mi_review ? '<span class="mi-badge">MI</span>' : ''}
                    </div>
                    <div class="review-date-track">${new Date(review.created_at).toLocaleDateString('ru-RU')}</div>
                  </div>
                </a>`
              : `<div class="review-author-link-track is-static">
                  <div class="review-avatar-track">
                    <img src="${getAvatarUrl(review.author_avatar)}" alt="avatar" onerror="this.onerror=null; this.src='svg/person.png';">
                  </div>
                  <div class="review-author-info">
                    <div class="review-author-name-track">
                      ${escapeHtml(review.author_name || (review.is_mi_review ? 'Music Inspector AI' : 'Пользователь'))}
                      ${review.is_mi_review ? '<span class="mi-badge">MI</span>' : ''}
                    </div>
                    <div class="review-date-track">${new Date(review.created_at).toLocaleDateString('ru-RU')}</div>
                  </div>
                </div>`}
          </div>
          <div class="review-score-track" style="color:${getReviewScoreColor(scoreValue)}">${scoreText}</div>
        </div>
        <div class="review-scores-track">
          <div class="score-item-track">Рифмы/образы: ${review.score1 || 'N/A'}</div>
          <div class="score-item-track">Структура/ритм: ${review.score2 || 'N/A'}</div>
          <div class="score-item-track">Реализация стиля: ${review.score3 || 'N/A'}</div>
          <div class="score-item-track">Личность/харизма: ${review.score4 || 'N/A'}</div>
          <div class="score-item-track">Атмосфера/вайб: ${review.score5 || 'N/A'}</div>
        </div>
        <div class="review-text-track">${escapeHtml(review.text)}</div>
        <div class="review-helpful-track" data-review-id="${review.id}" data-my-vote="${myVote}">
          <div class="review-helpful-title">Полезно?</div>
          <div class="review-helpful-actions">
            <button type="button" class="helpful-vote-btn up ${myVote === 1 ? 'is-active' : ''}" data-review-id="${review.id}" data-vote="1">
              <span class="helpful-icon">+</span>
              <span class="helpful-count" data-role="upvotes">${upvotes}</span>
            </button>
            <button type="button" class="helpful-vote-btn down ${myVote === -1 ? 'is-active' : ''}" data-review-id="${review.id}" data-vote="-1">
              <span class="helpful-icon">-</span>
              <span class="helpful-count" data-role="downvotes">${downvotes}</span>
            </button>
            <span class="helpful-score-track" data-role="helpful-score">${helpfulScore}</span>
          </div>
        </div>
      </div>
      `;
    }

    function scrollToRequestedReview() {
      if (!Number.isInteger(targetReviewId) || targetReviewId <= 0) {
        return false;
      }

      const targetCard = document.querySelector(`.review-card-track[data-review-id="${targetReviewId}"]`);
      if (!targetCard) {
        return false;
      }

      targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return true;
    }

    function renderTrackReviews() {
      const reviewsList = document.getElementById('reviews-list');
      if (!reviewsList) {
        return;
      }

      if (!loadedTrackReviews.length) {
        reviewsList.innerHTML = '<div class="no-reviews">Пока нет рецензий</div>';
        return;
      }

      const sortedReviews = sortTrackReviews(loadedTrackReviews);
      reviewsList.innerHTML = sortedReviews.map(renderReviewCard).join('');

      if (!hasScrolledToTargetReview) {
        hasScrolledToTargetReview = scrollToRequestedReview();
      }
    }

    // Load reviews (only approved)
    async function loadReviews() {
      try {
        const response = await getReviewsByTrack(trackId);
        const reviews = response.reviews || [];

        loadedTrackReviews = reviews.filter((r) =>
          !r.status || r.status === 'approved' || r.status === null || r.status === undefined
        );

        renderTrackReviews();
      } catch (error) {
        console.error('Error loading reviews:', error);

        let errorMessage = 'Ошибка загрузки рецензий';
        if (error.status === 0) {
          errorMessage = 'Не удалось подключиться к серверу. Проверьте подключение к интернету.';
        } else if (error.status === 404) {
          errorMessage = 'Релиз не найден';
        } else if (error.status === 500) {
          errorMessage = 'Ошибка сервера. Попробуйте позже.';
        } else if (error.message) {
          errorMessage = error.message;
        }

        document.getElementById('reviews-list').innerHTML = `<div class="no-reviews">${errorMessage}</div>`;
      }
    }
    const reviewSortControls = document.getElementById('review-sort-controls');
    if (reviewSortControls) {
      updateSortButtonsLabels();

      reviewSortControls.addEventListener('click', (event) => {
        const sortBtn = event.target.closest('.review-sort-btn');
        if (!sortBtn) {
          return;
        }

        const nextSort = sortBtn.dataset.sort;
        if (!nextSort) {
          return;
        }

        if (nextSort === currentReviewSort) {
          currentReviewOrder = currentReviewOrder === 'desc' ? 'asc' : 'desc';
        } else {
          currentReviewSort = nextSort;
          currentReviewOrder = 'desc';
        }

        updateSortButtonsLabels();

        renderTrackReviews();
      });
    }

    const reviewsListEl = document.getElementById('reviews-list');
    if (reviewsListEl) {
      reviewsListEl.addEventListener('click', async (event) => {
        const voteButton = event.target.closest('.helpful-vote-btn');
        if (!voteButton) {
          return;
        }

        if (!currentUser) {
          showErrorModal(
            'Требуется авторизация',
            'Войдите, чтобы голосовать за рецензии.',
            'Войти',
            () => {
              window.location.href = 'login.html';
            }
          );
          return;
        }

        const reviewId = parseInt(voteButton.dataset.reviewId, 10);
        const selectedVote = parseInt(voteButton.dataset.vote, 10);
        if (!Number.isInteger(reviewId) || !Number.isInteger(selectedVote)) {
          return;
        }

        const helpfulBlock = voteButton.closest('.review-helpful-track');
        if (!helpfulBlock) {
          return;
        }

        const currentVote = parseInt(helpfulBlock.dataset.myVote || '0', 10) || 0;
        const nextVote = currentVote === selectedVote ? 0 : selectedVote;

        const buttons = helpfulBlock.querySelectorAll('.helpful-vote-btn');
        buttons.forEach((btn) => {
          btn.disabled = true;
        });

        try {
          const result = await voteReview(reviewId, nextVote);
          const finalVote = Number(result.my_vote || 0);

          helpfulBlock.dataset.myVote = String(finalVote);
          const upvotesEl = helpfulBlock.querySelector('[data-role="upvotes"]');
          const downvotesEl = helpfulBlock.querySelector('[data-role="downvotes"]');
          const scoreEl = helpfulBlock.querySelector('[data-role="helpful-score"]');

          if (upvotesEl) {
            upvotesEl.textContent = String(Number(result.upvotes || 0));
          }
          if (downvotesEl) {
            downvotesEl.textContent = String(Number(result.downvotes || 0));
          }
          if (scoreEl) {
            scoreEl.textContent = String(Number(result.helpful_score || 0));
          }

          buttons.forEach((btn) => {
            const voteValue = parseInt(btn.dataset.vote || '0', 10);
            btn.classList.toggle('is-active', voteValue === finalVote);
          });
        } catch (error) {
          console.error('Error voting review:', error);
          showErrorModal('Ошибка', error.message || 'Не удалось отправить голос.');
        } finally {
          buttons.forEach((btn) => {
            btn.disabled = false;
          });
        }
      });
    }

    // Handle review form
    const reviewForm = document.getElementById('review-form');
    if (reviewForm) {
      reviewForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Check authentication before submitting
        if (!currentUser) {
          showErrorModal(
            'Требуется авторизация',
            'Для написания рецензии необходимо войти в систему.',
            'Войти',
            () => {
              window.location.href = 'login.html';
            }
          );
          return;
        }
        
        const formData = new FormData(e.target);

        showLoadingModal('Отправка рецензии...');

        try {
          await addReview({
            trackId: parseInt(trackId),
            text: formData.get('text'),
            score1: parseInt(formData.get('score1')),
            score2: parseInt(formData.get('score2')),
            score3: parseInt(formData.get('score3')),
            score4: parseInt(formData.get('score4')),
            score5: parseInt(formData.get('score5'))
          });

          closeModal();
          e.target.reset();
          addReviewFormContainer.style.display = 'none';
          
          // Reset slider values
          for (let i = 1; i <= 5; i++) {
            const valueEl = document.getElementById(`score${i}-value`);
            const slider = document.getElementById(`score${i}`);
            if (valueEl) valueEl.textContent = '5';
            if (slider) slider.value = 5;
          }
          
          // Show success modal with clear message about moderation
          showSuccessModal(
            'Рецензия отправлена!',
            'Спасибо! Ваша рецензия отправлена на модерацию и появится на странице после проверки.',
            'Понятно'
          );
          
          // Reload reviews to show any new approved ones
          loadReviews();
        } catch (error) {
          console.error('Error adding review:', error);
          closeModal();
          
          // Show specific error message
          let errorMessage = 'Произошла ошибка при отправке рецензии.';
          if (error.status === 400) {
            errorMessage = error.message || 'Неверные данные. Проверьте все поля.';
          } else if (error.status === 401) {
            showErrorModal(
              'Требуется авторизация',
              'Пожалуйста, войдите в систему для написания рецензий.',
              'Войти',
              () => {
                window.location.href = 'login.html';
              }
            );
            return;
          } else if (error.status === 500) {
            errorMessage = 'Ошибка сервера. Попробуйте позже.';
          } else if (error.message) {
            errorMessage = error.message;
          }
          
          showErrorModal('Ошибка', errorMessage);
        }
      });
    }

    // Initialize
    loadTrack();
    loadReviews();
</script>
</body>
</html>
