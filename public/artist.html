<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Inspector - Исполнитель</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="nav-bar">
    <a href="index.html">
      <div class="svg-logo"><svg fill="#D9D9D9" width="45px" height="45px" viewBox="0 0 256 256" id="Flat" xmlns="http://www.w3.org/2000/svg">

      </svg></div>
      <div class="name-logo">Music Inspector</div>
    </a>
    <a href="about-us.html">
      <div class="about-us-but"><svg fill="#969696" width="25px" height="25px" viewBox="-3 0 19 19" xmlns="http://www.w3.org/2000/svg" class="cf-icon-svg"><path d="M12.517 12.834v1.9a1.27 1.27 0 0 1-1.267 1.267h-9.5a1.27 1.27 0 0 1-1.267-1.267v-1.9A3.176 3.176 0 0 1 3.65 9.667h5.7a3.176 3.176 0 0 1 3.167 3.167zM3.264 5.48A3.236 3.236 0 1 1 6.5 8.717a3.236 3.236 0 0 1-3.236-3.236z"/></svg></div>
    </a>
    <div class="search-bar">
      <div class="search-icon">
        <svg stroke="currentColor" fill="#969696" stroke-width="0" viewBox="0 0 512 512" class="size-4" height="25px" width="25px" xmlns="http://www.w3.org/2000/svg"><path d="M337.509 305.372h-17.501l-6.571-5.486c20.791-25.232 33.922-57.054 33.922-93.257C347.358 127.632 283.896 64 205.135 64 127.452 64 64 127.632 64 206.629s63.452 142.628 142.225 142.628c35.011 0 67.831-13.167 92.991-34.008l6.561 5.487v17.551L415.18 448 448 415.086 337.509 305.372zm-131.284 0c-54.702 0-98.463-43.887-98.463-98.743 0-54.858 43.761-98.742 98.463-98.742 54.7 0 98.462 43.884 98.462 98.742 0 54.856-43.762 98.743-98.462 98.743z"></path></svg>
      </div>
      <input type="text" class="search-input" placeholder="Поиск...">
    </div>
    <!-- Auth buttons (shown when not logged in) -->
    <a href="login.html" class="sing-in-but auth-buttons">Войти</a>
    <a href="register.html" class="sing-up-but auth-buttons">Регистрация</a>
    
    <!-- Profile button (shown when logged in) -->
    <div class="profile-section" style="display: none;">
      <span class="profile-nickname" id="profile-nickname"></span>
      <a href="profile.html" class="profile-avatar-link">
        <div class="profile-avatar" id="profile-avatar"></div>
      </a>
    </div>
  </div>

  <div class="container">
    <div class="artist-page">
      <!-- Artist Header -->
      <div class="artist-header">
        <div class="artist-image-large">
          <img id="artist-image" src="svg/person.png" alt="Исполнитель" onerror="this.onerror=null; this.src='svg/person.png';">
        </div>
        <div class="artist-info-large">
          <h1 id="artist-name" class="artist-name-large">Загрузка...</h1>
          <div id="artist-bio" class="artist-bio"></div>
          <div class="artist-stats">
            <div class="stat-item stat-people">
              <div class="stat-value" id="people-rating">—</div>
              <div class="stat-label">Рейтинг пользователей</div>
            </div>
            <div class="stat-item stat-mi">
              <div class="stat-value" id="mi-rating">—</div>
              <div class="stat-label">MI рейтинг</div>
            </div>
            <div class="stat-item stat-releases">
              <div class="stat-value" id="releases-count">0</div>
              <div class="stat-label">Релизы</div>
            </div>
            <div class="stat-item stat-reviews">
              <div class="stat-value" id="reviews-count">0</div>
              <div class="stat-label">Рецензии</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Releases Section -->
      <div class="artist-releases-section">
        <h2>Релизы</h2>
        <div id="releases-grid" class="releases-grid">
          <!-- Releases will be loaded here -->
        </div>
        <div id="no-releases" class="no-releases" style="display: none;">
          У этого исполнителя пока нет релизов
        </div>
      </div>
    </div>
  </div>

  <script src="js/nav-mobile.js?v=20260408" defer></script>
  <script type="module">
    import { getArtistWithStats, resolveArtistUrl } from './js/api.js?v=20260412';
    import { renderReleaseCardAll } from './js/releases.js?v=20260412';
    import { initAuthStatus } from './js/auth-status.js?v=20260412';

    const urlParams = new URLSearchParams(window.location.search);
    const artistId = urlParams.get('id');

    if (!artistId) {
      window.location.href = 'index.html';
    }

    // Initialize auth status
    await initAuthStatus();

    // Load artist data
    async function loadArtist() {
      try {
        const response = await getArtistWithStats(artistId);
        const { artist, tracks, stats } = response;

        if (!artist) {
          throw new Error('Artist not found');
        }

        // Set artist name
        document.getElementById('artist-name').textContent = artist.name || 'Неизвестный исполнитель';
        document.title = `${artist.name} | Music Inspector`;

        // Set artist image
        let artistImage = artist.image_path || '';
        if (artistImage && !artistImage.startsWith('http://') && !artistImage.startsWith('https://') && !artistImage.startsWith('/')) {
          if (!artistImage.startsWith('uploads/')) {
            artistImage = `uploads/artists/${artistImage}`;
          }
        }
        document.getElementById('artist-image').src = resolveArtistUrl(artistImage) || 'svg/person.png';

        // Set bio
        if (artist.bio) {
          document.getElementById('artist-bio').textContent = artist.bio;
          document.getElementById('artist-bio').style.display = 'block';
        } else {
          document.getElementById('artist-bio').style.display = 'none';
        }

        // Set stats
        const formatScore = (value) => {
          const num = Number(value);
          return Number.isFinite(num) ? num.toFixed(1) : '—';
        };

        document.getElementById('people-rating').textContent = formatScore(stats.peopleRating);
        document.getElementById('mi-rating').textContent = formatScore(stats.miRating);
        document.getElementById('releases-count').textContent = stats.trackCount || 0;
        document.getElementById('reviews-count').textContent = stats.reviewCount || 0;

        // Render releases
        const releasesGrid = document.getElementById('releases-grid');
        const noReleases = document.getElementById('no-releases');
        
        if (tracks && tracks.length > 0) {
          releasesGrid.innerHTML = tracks.map(renderReleaseCardAll).join('');
          noReleases.style.display = 'none';
        } else {
          releasesGrid.innerHTML = '';
          noReleases.style.display = 'block';
        }
      } catch (error) {
        console.error('Error loading artist:', error);
        
        const errorMessage = error.status === 404 
          ? 'Исполнитель не найден' 
          : error.status === 500 
          ? 'Ошибка сервера. Попробуйте позже.' 
          : error.message || 'Ошибка загрузки исполнителя';
        
        document.getElementById('artist-name').textContent = 'Ошибка';
        document.getElementById('artist-bio').textContent = errorMessage;
        document.getElementById('releases-grid').innerHTML = '';
        document.getElementById('no-releases').style.display = 'block';
        document.getElementById('no-releases').textContent = errorMessage;
      }
    }

    // Initialize
    loadArtist();
  </script>
</body>
</html>
